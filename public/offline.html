<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>オフライン - BELLO在庫管理</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; background:#f6f7fb; color:#1f2c4d;
    display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:24px; }
  .box { max-width: 320px; }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { font-size: 14px; color:#4a63a0; }
  button { margin-top: 16px; padding: 12px 24px; border-radius: 999px; border:none; background:#1f2c4d; color:#fff; font-size:14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>通信がオフラインです</h1>
    <p>電波状況の良い場所に移動するか、通信が回復してからもう一度お試しください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
