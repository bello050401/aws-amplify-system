<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <!-- 画像表示高速化・段階読込QA是正: 完全合成fixture(顧客画像は一切使わない)。
       ギャラリーmedium段階(960px相当、詳細画面のメイン画像の先行表示)を表す。 -->
  <rect width="960" height="960" fill="#dcfce7"/>
  <rect x="24" y="24" width="912" height="912" fill="none" stroke="#16a34a" stroke-width="12"/>
  <text x="480" y="450" font-family="sans-serif" font-size="84" fill="#14532d" text-anchor="middle">MEDIUM</text>
  <text x="480" y="540" font-family="sans-serif" font-size="48" fill="#14532d" text-anchor="middle">960px fixture</text>
</svg>
