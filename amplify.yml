version: 1
backend:
  phases:
    build:
      commands:
        # TEMPORARY WORKAROUND (see docs/aws-test-environment.md): `npm ci`
        # currently fails here with `Missing: @opentelemetry/core@2.0.0 from
        # lock file`. Root cause is a bug in AWS's own published
        # @aws-amplify/data-construct / @aws-amplify/graphql-api-construct
        # packages (confirmed present in the latest version, 1.17.7 /
        # 1.22.2, and in the two prior patch releases too): they bundle an
        # internally inconsistent set of @opentelemetry/* sub-dependencies.
        # Bundled dependencies cannot be fixed from this repo's package.json
        # (npm `overrides` does not apply to them), so `npm ci`'s strict
        # lockfile self-consistency check fails on every install even
        # though package.json and package-lock.json are otherwise in sync.
        # `npm install` does not perform that same strict check and
        # reliably produces a working node_modules here. Revert this back
        # to `npm ci` once AWS publishes a fixed data-construct/
        # graphql-api-construct release.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # TEMPORARY WORKAROUND: same reason as the backend phase above
        # (`npm ci` fails on a bug in AWS's own bundled dependencies, not
        # on anything in this repo) - see the comment there and
        # docs/aws-test-environment.md for the full explanation.
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        # Amplify build variables are not exposed to Next.js SSR by default.
        # This non-secret switch is enabled only on the staging branch; other
        # branches receive 0 and cannot send BASE private test writes.
        - echo "BASE_PRIVATE_TEST_WRITES_ENABLED=${BASE_PRIVATE_TEST_WRITES_ENABLED:-0}" >> .env.production
        # IDs and HTTPS origin only. Never place Next Engine credentials or tokens in build artifacts.
        - echo "NEXT_ENGINE_APP_SECRET_ID=${NEXT_ENGINE_APP_SECRET_ID:-}" >> .env.production
        - echo "NEXT_ENGINE_TOKEN_SECRET_ID=${NEXT_ENGINE_TOKEN_SECRET_ID:-}" >> .env.production
        - echo "NEXT_ENGINE_PUBLIC_ORIGIN=${NEXT_ENGINE_PUBLIC_ORIGIN:-}" >> .env.production
        # Both non-secret gates default to off. Enable only after the test app's
        # mall auto-sync settings and one-time acceptance have been reviewed.
        - echo "NEXT_ENGINE_PRIVATE_MASTER_TEST_ENABLED=${NEXT_ENGINE_PRIVATE_MASTER_TEST_ENABLED:-0}" >> .env.production
        - echo "NEXT_ENGINE_PRIVATE_MASTER_TEST_V2_ENABLED=${NEXT_ENGINE_PRIVATE_MASTER_TEST_V2_ENABLED:-0}" >> .env.production
        - echo "NEXT_ENGINE_NO_AUTO_MALL_SYNC_CONFIRMED=${NEXT_ENGINE_NO_AUTO_MALL_SYNC_CONFIRMED:-0}" >> .env.production
        # Temporary, non-secret photo-cache measurement. Exact staging app/branch,
        # explicit 48h-or-shorter UTC window, release A/B and UUID are also checked in code.
        - echo "PHOTO_CACHE_TELEMETRY_ENABLED=${PHOTO_CACHE_TELEMETRY_ENABLED:-0}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_APP_ID=${AWS_APP_ID:-}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_BRANCH=${AWS_BRANCH:-}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_RELEASE_TAG=${PHOTO_CACHE_TELEMETRY_RELEASE_TAG:-}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_EXPERIMENT_ID=${PHOTO_CACHE_TELEMETRY_EXPERIMENT_ID:-}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_START_AT=${PHOTO_CACHE_TELEMETRY_START_AT:-}" >> .env.production
        - echo "PHOTO_CACHE_TELEMETRY_END_AT=${PHOTO_CACHE_TELEMETRY_END_AT:-}" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
