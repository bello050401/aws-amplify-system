version: 1
backend:
  phases:
    build:
      commands:
        # TEMPORARY WORKAROUND (see docs/aws-test-environment.md): `npm ci`
        # currently fails here with `Missing: @opentelemetry/core@2.0.0 from
        # lock file`. Root cause is a bug in AWS's own published
        # @aws-amplify/data-construct / @aws-amplify/graphql-api-construct
        # packages (confirmed present in the latest version, 1.17.7 /
        # 1.22.2, and in the two prior patch releases too): they bundle an
        # internally inconsistent set of @opentelemetry/* sub-dependencies.
        # Bundled dependencies cannot be fixed from this repo's package.json
        # (npm `overrides` does not apply to them), so `npm ci`'s strict
        # lockfile self-consistency check fails on every install even
        # though package.json and package-lock.json are otherwise in sync.
        # `npm install` does not perform that same strict check and
        # reliably produces a working node_modules here. Revert this back
        # to `npm ci` once AWS publishes a fixed data-construct/
        # graphql-api-construct release.
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # TEMPORARY WORKAROUND: same reason as the backend phase above
        # (`npm ci` fails on a bug in AWS's own bundled dependencies, not
        # on anything in this repo) - see the comment there and
        # docs/aws-test-environment.md for the full explanation.
        - npm install --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - .next/cache/**/*
