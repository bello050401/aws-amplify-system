# Apply only as the isolated branch buildSpec. Do not replace amplify.yml.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - node scripts/security-hosted-build.cjs
frontend:
  phases:
    build:
      commands:
        - npm ci --prefix mobile --cache .npm --prefer-offline
        - npm run export:web --prefix mobile
        - node scripts/package-staff-web.cjs
        - NODE_OPTIONS="--max-old-space-size=4096" npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
